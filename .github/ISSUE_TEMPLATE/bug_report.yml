name: Bug Report
description: Create a bug report
type: Bug
body:
    -   type: textarea
        attributes:
            label: Describe the issue
            description: Describe what happens instead of the expected behavior
            placeholder: Describe the issue
    -   type: textarea
        attributes:
            label: Steps to reproduce
            description: |
                Provide a set of unambiguous steps to reproduce the issue
            value: |
                Steps:

                1. Go to '...'
                2. Click on '...'
                3. Scroll down to '...'
                4. See the issue
    -   type: textarea
        id: logs
        attributes:
            label: Relevant log output
            description: Please copy and paste any relevant log output. This will be automatically formatted into code, so there is no need for backticks.
            render: shell
            placeholder: Paste in any relevant logs or a link to https://gist.github.com/
    -   type: textarea
        attributes:
            label: Screenshots/pictures and/or videos
            description: |
                Add screenshots and/or videos to help demonstrate the issue
            placeholder: Paste in any images or videos that show the issue
